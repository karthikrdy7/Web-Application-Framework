<!DOCTYPE html>
<html>
<body>
<h2>Temperature Conversion</h2>
<h3>program 4</h3>
<p id="result"></p>

<script>

let celsius = 31;
let fahrenheit = 78;

document.getElementById("result").innerHTML =
    celsius + "°C = " + (celsius * 9 / 5) + 32  + "°F<br>" +
    fahrenheit + "°F = " + (fahrenheit - 32) * 5 / 9 + "°C";
</script>
</body>
</html>
