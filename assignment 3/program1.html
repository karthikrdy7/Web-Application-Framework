<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types</title>
</head>
<body>

    <h2>JavaScript variables and Data Types</h2>
    <h3>program 1</h3>
    <div id="output"></div>

    <script>
        // Variables of different data types
        let name = "Karthik";          // String
        let age = 21;                  // Number
        let isStudent = true;          // Boolean
        let marks = [85, 90, 78];      // Array
        let value = null;              // Null
        let data;                      // Undefined

        // Display values on the web page
        document.getElementById("output").innerHTML =
            "Name: " + name + "<br>" +
            "Age: " + age + "<br>" +
            "Is Student: " + isStudent + "<br>" +
            "Marks: " + marks + "<br>" +
            "Null Value: " + value + "<br>" +
            "Undefined Value: " + data;
    </script>
</body>
</html>
