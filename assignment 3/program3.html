<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Area and Perimeter</title>
</head>
<body>

    <h2>Rectangle Area and Perimeter</h2>
    <h3>program 3</h3>
    <div id="output"></div>

    <script>

        let length = 10;
        let width = 5;

        document.getElementById("output").innerHTML =
            "Length: " + length + "<br>" +
            "Width: " + width + "<br>" +
            "Area: " + (length * width) + "<br>" +
            "Perimeter: " + 2*(length + width);
    </script>

</body>
</html>
