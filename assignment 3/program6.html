<!DOCTYPE html>
<html>
<body>
<h2>Largest of Three Numbers</h2>
<h3>program 6</h3>
<p id="result"></p>

<script>
let a = 10;
let b = 31;
let c = 78;
let largest;

if (a >= b && a >= c) {
    largest = a;
} else if (b >= a && b >= c) {
    largest = b;
} else {
    largest = c;
}

document.getElementById("result").innerHTML =
    "Largest number = " + largest;
</script>
</body>
</html>
