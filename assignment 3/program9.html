<!DOCTYPE html>
<html>
<body>
<h2>Sum of Natural Numbers</h2>
<h3>program 9</h3>
<p id="result"></p>

<script>
let n = 10;
let sum = 0;

for (let i = 1; i <= n; i++) {
    sum += i;
}

document.getElementById("result").innerHTML =
    "Sum of first " + n + " natural numbers = " + sum;
</script>
</body>
</html>
