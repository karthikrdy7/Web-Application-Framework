<!DOCTYPE html>
<html>
<body>
<h2>Even or Odd</h2>
<h3>program 5</h3>
<p id="result"></p>

<script>
let number = 78;

if (number % 2 === 0) {
    document.getElementById("result").innerHTML =
        number + " is Even";
} else {
    document.getElementById("result").innerHTML =
        number + " is Odd";
}
</script>
</body>
</html>
