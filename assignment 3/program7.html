<!DOCTYPE html>
<html>
<body>
<h2>Factorial</h2>
<h3>program 7</h3>
<p id="result"></p>

<script>
let number = 5;
let factorial = 1;

for (let i = 1; i <= number; i++) {
    factorial = factorial * i;
}

document.getElementById("result").innerHTML =
    "Factorial of " + number + " = " + factorial;
</script>
</body>
</html>
