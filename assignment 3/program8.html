<!DOCTYPE html>
<html>
<body>
<h2>Multiplication Table</h2>
<h3>program 8</h3>
<p id="result"></p>

<script>
let number = 5;
let output = "";

for (let i = 1; i <= 10; i++) {
    output += number + " × " + i + " = " + (number * i) + "<br>";
}

document.getElementById("result").innerHTML = output;
</script>
</body>
</html>
